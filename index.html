<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ganemos.net</title>

  <link rel="icon" type="image/webp" href="favicon-whatsapp.webp">

  <style>
    :root {
      --btn-green: #25D366;
      --btn-green-dark: #128C7E;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      --overlay: rgba(0, 0, 0, 0.45);
      --blur: 24px;
      --btn-top-desktop: 60vh;
      --btn-top-mobile: 78vh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Ubuntu,
        Cantarell,
        Arial,
        sans-serif;
      background: #000;
      color: #fff;
    }

    .stage {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .hero {
      position: relative;
      height: 90vh;
    }

    .hero .bg {
      position: absolute;
      inset: 0;
      background: url("fondo.jpeg") center / cover no-repeat;
      filter: blur(var(--blur)) brightness(0.9);
      transform: scale(1.06);
      z-index: 0;
    }

    .hero .overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay);
      z-index: 1;
    }

    .hero .fg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 2;
      pointer-events: none;
    }

    .hero .fg img {
      height: 90vh;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .cta {
      position: absolute;
      top: var(--btn-top-desktop);
      left: 50%;
      z-index: 3;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;

      width: clamp(240px, 80vw, 420px);
      padding: 1.2rem 1.8rem;

      border-radius: 999px;
      background: linear-gradient(
        135deg,
        var(--btn-green),
        var(--btn-green-dark)
      );

      color: #fff;
      font-size: clamp(1.1rem, 3.8vw, 1.4rem);
      font-weight: 900;
      text-decoration: none;

      box-shadow: var(--shadow);
      transform: translateX(-50%);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .cta:hover {
      transform: translateX(-50%) scale(1.06);
      filter: saturate(1.08);
    }

    .cta:active {
      transform: translateX(-50%) scale(0.98);
    }

    .wa-icon {
      width: 34px;
      height: 34px;
    }

    .benefits {
      position: relative;
      z-index: 4;

      display: flex;
      justify-content: center;
      align-items: center;

      height: 10vh;
      padding: 1rem;
      background: #000;
    }

    .benefit-box {
      max-width: min(560px, 92vw);
      padding: 1rem 1.5rem;

      border-radius: 12px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .benefit-box h3 {
      margin: 0 0 0.5rem;
      color: #ffd83b;
      font-size: 1.2rem;
    }

    .benefit-box p {
      margin: 0.2rem 0;
      font-size: 0.9rem;
    }

    @media (max-width: 767px) {
      .cta {
        top: var(--btn-top-mobile);
      }
    }
  </style>
</head>

<body>
  <main class="stage">

    <section class="hero" aria-label="Imagen destacada">
      <div class="bg" aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>

      <div class="fg">
        <img src="fondo.jpeg" alt="Imagen de portada">
      </div>

      <a
        id="whatsapp-cta"
        class="cta"
        href="https://wa.me/541159420738?text=%C2%A1Buenas%21%20Me%20gustar%C3%ADa%20crear%20un%20usuario.%20Mi%20nombre%20es%3A"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir WhatsApp para crear usuario"
      >
        <img
          src="favicon-whatsapp.webp"
          alt=""
          class="wa-icon"
        >
        ¡Creá tu usuario!
      </a>
    </section>

    <section class="benefits">
      <div class="benefit-box">
        <h3>Beneficios exclusivos</h3>
        <p>Recibí bonos de bienvenida y promociones especiales.</p>
        <p>Mínimo de carga: $2.000</p>
      </div>
    </section>

  </main>

  <script>
    const whatsappButton = document.getElementById('whatsapp-cta');

    whatsappButton.addEventListener('click', function() {
      if (typeof fbq === 'function') {
        fbq('trackCustom', 'WhatsAppClick', {
          button_text: 'Crear usuario',
          destination: 'WhatsApp'
        });
      }
    });
  </script>
</body>
</html>
